[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kion-temporal-recsys"
version = "0.1.0"
description = "Reproducible KION temporal feature selection and decay experiments"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "catboost>=1.2.7", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
retrieval = ["implicit>=0.7.2,<0.8"]

[project.scripts]
kion-common-test = "kion_recsys.common_test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
